[build-system]
requires = [
    "setuptools >= 68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "pulp-helmchart"
version = "0.2.0"
description = "Pulp plugin for classic Helm chart repositories"
readme = "README.md"
authors = [
  {name = "Pulp Helm Chart Contributors"},
]
license = {text = "GPL-2.0-or-later"}
classifiers = [
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
  "pulpcore>=3.109,<3.116",
  "PyYAML>=5.1.1,<6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.8,<5",
]

[project.urls]
Homepage = "https://github.com/pulp/pulp-helmchart"
Repository = "https://github.com/pulp/pulp-helmchart"

[project.entry-points."pulpcore.plugin"]
pulp_helmchart = "pulp_helmchart:default_app_config"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulp_helmchart", "pulp_helmchart.*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Preserve shipped migration files; formatting them would change historical migrations.
extend-exclude = [
  "pulp_helmchart/app/migrations/0001_initial.py",
  "pulp_helmchart/app/migrations/0002_remote_and_sync.py",
  "pulp_helmchart/app/migrations/0003_remote_filters.py",
  "pulp_helmchart/app/migrations/0004_remote_unavailable_controls.py",
  "pulp_helmchart/app/migrations/0005_remote_exclude_versions.py",
]
